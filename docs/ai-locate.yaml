# amux — AI locate index (machine-readable)
# Workflow: match task → read_first → grep symbols in search_in → verify tests
# Human map: docs/AI_CODEBASE_MAP.md | Architecture depth: STRUCT.md

version: 1
scope: amux-repository
project: amux
module: amux-accounts
entrypoint: main.go → pkg/cli/cli.go

layers:
  - id: cli
    path: pkg/cli/
    role: "Lệnh amux, dispatch subcommands"
  - id: ui
    path: pkg/ui/
    role: "Hiển thị accounts/status/pool/login wizard"
  - id: proxy
    path: pkg/proxy/
    role: "HTTP :8787, rotator Claude, /_am admin"
  - id: bridge
    path: pkg/bridge/
    role: "OpenAI / Anthropic / Gemini / Responses wire → ChatRequest"
  - id: router
    path: pkg/router/
    role: "Pool failover, group priority, session LB, task classify"
  - id: provider
    path: pkg/provider/
    role: "Adapters + accounts.json load/save"
  - id: tools
    path: pkg/tools/
    role: "Tool dialect + webloop text emulation"
  - id: ctxshrink
    path: pkg/ctxshrink/
    role: "Tối ưu hóa token budget 20k, cắt tỉa kết quả tool"
  - id: guard
    path: pkg/guard/
    role: "Anti-ban, affinity, pacer, health, quarantine"
  - id: identity
    path: pkg/identity/
    role: "Flat identities.json, keychain, credential migration"
  - id: profile
    path: pkg/profile/
    role: "Claude/codex/agy CLI profile snapshots ~/.amux"
  - id: types
    path: pkg/types/
    role: "Contracts — no internal pkg imports"
  - id: mcp
    path: pkg/mcp/
    role: "MCP stdio server, amux_* tools, installer cho MCP host"

data_paths:
  config_dir: "~/.amux"
  accounts: "~/.amux/accounts.json"
  identities: "~/.amux/identities.json"
  profiles: "~/.amux/profiles/"
  logs: ["~/.amux/events.log", "~/.amux/requests.log", "~/.amux/errors.log"]

http:
  openai: ["/v1/chat/completions", "/v1/responses", "/v1/models"]
  anthropic: ["/v1/messages"]
  gemini: ["/v1beta/models", ":generateContent", ":countTokens"]
  admin_prefix: "/_am/"
  admin_note: "Chỉ amux control plane — không thêm /_am/* theo slash command Claude"

tasks:
  - id: accounts-list-group-ui
    keywords: [accounts, ls, pool, status, group, API provider section]
    read_first:
      - docs/AI_CODEBASE_MAP.md
      - pkg/ui/account_groups.go
      - pkg/ui/login.go
      - pkg/ui/status.go
    symbols: [forEachAccountGroup, ResolveAccountGroup, ResolveProfileGroup, apiProviderBrand]
    tests: [pkg/ui/account_groups_test.go]

  - id: session-own-account
    keywords: [session, affinity, sticky, round-robin, per-tab, load balance]
    read_first:
      - pkg/router/pool.go
      - pkg/guard/affinity.go
      - pkg/router/session_lb.go
    symbols: [ExtractSessionKey, pickSessionAdapter, GlobalAffinity, livingForSessionBalance, sessionRR]
    tests: [pkg/router/session_lb_test.go]

  - id: pool-failover-groups
    keywords: [failover, group priority, codex_sub, api_other, skip web tools]
    read_first:
      - pkg/router/group.go
      - pkg/router/pool.go
      - pkg/router/task_prefer.go
    symbols: [GroupPriority, ProxyGroupsForClient, GroupOrderForRequest, skipTextOnly, Send]
    tests: [pkg/router/group_test.go, pkg/router/pool_test.go]

  - id: soft-task-prefer
    keywords: [task kind, coding, analysis, review, classify, thinking, pro tier]
    read_first:
      - pkg/router/classifier.go
      - pkg/router/task_prefer.go
      - pkg/types/chat.go
    symbols: [ClassifyTask, applyTaskClassification, PreferredGroupsForTask, TaskKind]
    tests: [pkg/router/classifier_test.go, pkg/router/task_prefer_test.go]

  - id: claude-code-messages
    keywords: [claude code, anthropic, tool_use, /v1/messages, bash read]
    read_first:
      - pkg/bridge/claude.go
      - pkg/tools/claude.go
      - pkg/proxy/server.go
    symbols: [HandleClaudeMessages, writeAnthropicSSE]
    tests: [pkg/bridge/claude_test.go, pkg/tools/dialect_loop_test.go]

  - id: codex-openai-responses
    keywords: [codex, responses, chat/completions, exec_command, tool_calls]
    read_first:
      - pkg/bridge/openai.go
      - pkg/bridge/responses.go
      - pkg/tools/codex.go
      - pkg/provider/codex_cli.go
    symbols: [openaiClientDialect, HandleOpenAIResponses, DialectCodex]
    tests: [pkg/bridge/codex_loop_test.go, pkg/bridge/openai_test.go]

  - id: agy-gemini-gateway
    keywords: [antigravity, agy, gemini, GOOGLE_GEMINI_BASE_URL, generateContent]
    read_first:
      - pkg/bridge/gemini.go
      - pkg/provider/agy.go
      - pkg/cli/cli.go
    symbols: [HandleGeminiGenerateContent, cmdRun]
    tests: [pkg/bridge/agy_loop_test.go]

  - id: web-tool-emulation
    keywords: [webloop, tool_call, chatgpt web, claude web, text-only, multi-schema, lenient parser, parameters, function arguments, flat json, sanitize markup]
    read_first:
      - pkg/tools/webloop.go
      - pkg/provider/chatgpt_web.go
      - pkg/provider/claude_web.go
      - pkg/mcp/backend.go
    symbols: [MaybeWrapWebStream, SupportsTools, parseToolCallJSON, StripWebToolMarkup]
    tests: [pkg/tools/webloop_test.go, pkg/tools/webloop_emulate_test.go]

  - id: ide-runner-sandbox
    keywords: [amux run, sandbox, cursor settings, child process, isolated env, preflight account check]
    read_first:
      - pkg/cli/run.go
      - pkg/hook/cursor.go
      - pkg/cli/cli.go
    symbols: [cmdRun, LoadCursorSettings, findAppBinary]
    tests: [pkg/cli/cli_test.go]

  - id: claude-oauth-rotate
    keywords: [rotator, 5h, 7d, claude subscription, oauth refresh]
    read_first:
      - pkg/proxy/rotator.go
      - pkg/auth/token.go
      - pkg/profile/manager.go
    symbols: [Rotator, ForceSwitch, Status]
    tests: [pkg/proxy/rotator_test.go]

  - id: accounts-json-providers
    keywords: [accounts.json, provider add, priority, enabled, group ide]
    read_first:
      - pkg/provider/config.go
      - accounts.example.json
      - pkg/types/id.go
    symbols: [LoadConfigFile, ProviderConfig, Normalize, BuildAdapters]
    tests: [pkg/provider/config_test.go]

  - id: env-hooks-launchctl
    keywords: [amux env, hook install, launchctl, ANTHROPIC_BASE_URL, GOOGLE_API_KEY]
    read_first:
      - pkg/env/env.go
      - pkg/hook/hook.go
      - pkg/hook/launchctl.go
    symbols: [PrintEnvExports, SyncLaunchctlEnv]
    tests: [pkg/env/env_test.go, pkg/hook/settings_env_test.go]

  - id: guard-antiban
    keywords: [guard, quarantine, health score, pacer, 429]
    read_first:
      - pkg/guard/guard.go
      - pkg/guard/health.go
      - pkg/guard/pacer.go
    symbols: [RecordError, IsQuarantined, Pace]
    tests: [pkg/guard/guard_test.go]

  - id: proxy-admin-status
    keywords: [/_am/status, switch-provider, guard reset]
    read_first:
      - pkg/proxy/server.go
      - pkg/ui/status.go
    symbols: [newHandler, AccountPoolRouter.Status]
    tests: [pkg/proxy/server_test.go]

  - id: live-integration
    keywords: [live test, real api, go:build live]
    read_first:
      - pkg/live/live_test.go
    symbols: []
    tests: ["go test -tags live ./pkg/live -count=1"]

  - id: privacy-redact
    keywords: [redact, privacy, outbound payload]
    read_first:
      - pkg/privacy/redact.go
      - pkg/router/pool.go
    symbols: [redactBeforeSend]
    tests: [pkg/privacy/redact_test.go]

  - id: ctxshrink-token-budget
    keywords: [ctxshrink, token budget, 20k, 25k, 85k runes, context length, shrink, trim tool]
    read_first:
      - pkg/ctxshrink/shrink.go
      - pkg/bridge/responses.go
      - pkg/tools/webloop.go
    symbols: [ShrinkConversation, TrimLargeToolResults, DeduplicateToolCalls]
    tests: [pkg/ctxshrink/shrink_test.go]

  - id: cross-tool-matrix
    keywords: [cross tool matrix, bi-directional, mcp, subagent, claude codex agy]
    read_first:
      - pkg/bridge/cross_tool_matrix_test.go
      - pkg/tools/dialect.go
      - pkg/tools/claude.go
      - pkg/tools/codex.go
    symbols: [TranslateToolCall]
    tests: [pkg/bridge/cross_tool_matrix_test.go]

  - id: proxy-down-public
    keywords: [proxy down, public, revoke token, revert bind, 127.0.0.1]
    read_first:
      - pkg/proxy/client.go
      - pkg/cli/cli.go
    symbols: [CmdProxyDownPublic, SaveBindPublic, ClearAuthToken]
    tests: [pkg/proxy/client_test.go, pkg/cli/cli_test.go]

  - id: mcp-server
    keywords: [mcp, amux mcp, tools/list, amux_ask, mcp install, claude desktop, windsurf, opencode, zed, vscode]
    read_first:
      - pkg/mcp/server.go
      - pkg/mcp/tools.go
      - pkg/mcp/install.go
      - pkg/cli/mcp.go
    symbols: [Serve, RegisterAmuxTools, Targets, PoolMemberFilter]
    tests: [pkg/mcp/server_test.go, pkg/mcp/install_test.go]

  - id: rotation-pool
    keywords: [pool, amux pool, auto switch, rotate, subscription, manual only, threshold, switch, re-login]
    read_first:
      - pkg/cli/pool.go
      - pkg/identity/store.go
      - pkg/proxy/rotator.go
      - pkg/router/pool.go
    symbols: [CanAutoRotate, PoolMemberFilter, ProfileInPool, ProfileThreshold, SetSubscriptionPoolFilter, SwitchProfile]
    tests: [pkg/router/send_provider_test.go, pkg/proxy/rotator_test.go, pkg/identity/identity_test.go]

  - id: clean-removal
    keywords: [off, unhook, uninstall, mcp uninstall, purge, cleanup, hook state]
    read_first:
      - pkg/cli/system.go
      - pkg/cli/gateway.go
      - pkg/gateway/hook.go
      - pkg/mcp/install.go
    symbols: [CmdOff, cmdUninstall, UnhookAgy, UnhookCodex, Target.Uninstall, removeAmuxClaudeEnv]
    tests: [pkg/gateway/unhook_clean_test.go, pkg/mcp/install_test.go]

  - id: secret-store
    keywords: [keychain, secret store, vault, master key, keychain-free, AMUX_SECRET_STORE]
    read_first:
      - pkg/auth/secretstore.go
      - pkg/auth/crypto.go
      - pkg/browser/cookies.go
    symbols: [SecretStore, KCGet, KCSet, SetSecretStore, UsesFileSecretStore]
    tests: [pkg/auth/secretstore_test.go]

  - id: model-catalog
    keywords: [model id, default model, claude-opus-5-5, gpt-6, gemini-3.8, retired model]
    read_first:
      - pkg/tools/claude_models.go
      - pkg/provider/codex_cli.go
      - pkg/bridge/openai.go
    symbols: [DefaultClaudeModel, DefaultClaudeSonnetModel, ClaudeModelGeneration, codexDefaultModel]
    tests: [pkg/tools/claude_models_test.go, pkg/tools/model_ids_test.go]

invariants:
  - "Tools thực thi trên client CLI — proxy không exec shell/file"
  - "Không invent /_am/* cho từng Claude slash command"
  - "Pool skip web/Codex text-only khi có native tool backend (skipTextOnly)"
  - "Claude subscription group không làm pool proxy cho Claude IDE client"
  - "pkg/types không import pkg nội bộ khác"
  - "Toàn bộ lệnh CLI sử dụng amux binary thay cho am cũ"
  - "amux mcp: stdout chỉ cho JSON-RPC"
  - "Chế độ secret-store file không gọi Keychain/keyring"
  - "Chỉ dùng model id đã xác minh; không ship id đã khai tử"
